name: Scan test.py and Push Image to ECR

on:
  push:
    branches:
      - main
  pull_request:

jobs:

  #######################################
  # JOB 1 — Checkout Repo
  #######################################
  checkout:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm checkout
        run: |
          echo "=============================="
          echo "Repo cloned"
          echo "Branch: $(git branch --show-current)"
          echo "Commit: $(git rev-parse HEAD)"
          ls -la

  #######################################
  # JOB 2 — Verify test.py exists
  #######################################
  verify-file:
    runs-on: ubuntu-latest
    needs: checkout

    steps:
      - uses: actions/checkout@v4

      - name: Locate test.py
        run: |
          echo "Searching for test.py..."
          find . -name "test.py"

  #######################################
  # JOB 3 — Sonar Scan
  #######################################
  sonar-scan:
    runs-on: ubuntu-latest
    needs: verify-file

    steps:
      - uses: actions/checkout@v4

      - name: Install Sonar Scanner
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl

          curl -sSLo sonar-scanner.zip \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip

          unzip sonar-scanner.zip
          sudo mv sonar-scanner-* /opt/sonar-scanner
          echo "/opt/sonar-scanner/bin" >> $GITHUB_PATH

      - name: Run Sonar Scan (test.py only)
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner -X \
            -Dsonar.projectKey=sample-python-project \
            -Dsonar.sources=. \
            -Dsonar.inclusions=test.py \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.login=$SONAR_TOKEN

  #######################################
  # JOB 4 — Build Docker Image & Push to ECR
  #######################################
  docker-build-push:
    runs-on: ubuntu-latest
    needs: sonar-scan

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      #######################################
      # Configure AWS IAM Role via OIDC
      #######################################
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      #######################################
      # Login to Amazon ECR
      #######################################
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      #######################################
      # Build and Push Docker Image
      #######################################
      - name: Build and Push Docker Image
        env:
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Docker image..."

          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .

          docker tag $REGISTRY/$REPOSITORY:$IMAGE_TAG \
                     $REGISTRY/$REPOSITORY:latest

          echo "Pushing image to ECR..."

          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:latest
