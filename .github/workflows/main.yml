name: Scan test.py with SonarQube

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  Checkout-repo:
    runs-on: ubuntu-latest

    steps:

      #######################################
      # 1️⃣ Checkout Repository
      #######################################
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm checkout
        run: |
          echo "=============================="
          echo "Repo cloned"
          echo "Branch: $(git branch --show-current)"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Files in root:"
          ls -la
          echo "Repo checked out successfully"

    jobs:
      Verify files from repo:
    

      #######################################
      # 2️⃣ Verify test.py exists
      #######################################
      - name: Locate test.py
        run: |
          echo "Searching for test.py..."
          find . -name "test.py"

      #######################################
      # 3️⃣ Install SonarQube Scanner
      #######################################
      - name: Install Sonar Scanner
        run: |
          echo "Installing SonarQube Scanner..."
          sudo apt-get update
          sudo apt-get install -y unzip curl

          curl -sSLo sonar-scanner.zip \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip

          unzip sonar-scanner.zip
          sudo mv sonar-scanner-* /opt/sonar-scanner

          echo "/opt/sonar-scanner/bin" >> $GITHUB_PATH

      - name: Verify scanner install
        run: |
          echo "Sonar Scanner version:"
          sonar-scanner --version

      #######################################
      # 4️⃣ Run SonarQube Scan for test.py
      #######################################
      - name: Run Sonar Scan (test.py only)
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "Running Sonar scan in DEBUG mode..."

          sonar-scanner -X \
            -Dsonar.projectKey=sample-python-project \
            -Dsonar.sources=. \
            -Dsonar.inclusions=test.py \
            -Dsonar.host.url=http://3.84.133.97:9000  \
            -Dsonar.login=squ_047579d02ea204f5e52089ddf98dba20a4cabb10

      #######################################
      # Final Marker
      #######################################
      - name: Pipeline completed
        run: |
          echo "=============================="
          echo "Scan completed"
          echo "GitHub Actions job finished"
          echo "Check SonarQube dashboard for results"
          echo "=============================="
